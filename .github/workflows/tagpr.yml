name: tagpr

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: tagpr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tagpr:
    name: tagpr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: tagpr
        uses: Songmu/tagpr@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # When tagpr has an open release PR (but no new tag yet), push the
      # freshly built frontend bundle into that PR so the eventual tag
      # commit embeds it. This is what lets `go install @latest` launch
      # `rdq gui` without the SPA assets going missing. The cleanup
      # workflow (post-release.yml) then removes the bundle from main
      # HEAD so the repo stays clean between releases.
      - id: extract-pr
        if: steps.tagpr.outputs.pull_request != ''
        env:
          HEAD_REF: ${{ fromJSON(steps.tagpr.outputs.pull_request).head.ref }}
        run: |
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout tagpr release PR branch
        if: steps.extract-pr.outputs.head_ref != ''
        env:
          HEAD_REF: ${{ steps.extract-pr.outputs.head_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git checkout "$HEAD_REF"

      - name: Set up Node (for release PR bundle)
        if: steps.extract-pr.outputs.head_ref != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (for release PR bundle)
        if: steps.extract-pr.outputs.head_ref != ''
        working-directory: frontend
        run: npm ci

      - name: Build and commit frontend bundle into release PR
        if: steps.extract-pr.outputs.head_ref != ''
        env:
          PR_BRANCH: ${{ steps.extract-pr.outputs.head_ref }}
        run: |
          make frontend-build
          git add -f internal/server/dist/
          if git diff --cached --quiet; then
            echo "frontend bundle unchanged, nothing to commit"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(release): embed frontend bundle for go install"
          git push origin "HEAD:$PR_BRANCH"

      - name: Set up Go
        if: steps.tagpr.outputs.tag != ''
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        if: steps.tagpr.outputs.tag != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.tagpr.outputs.tag != ''
        working-directory: frontend
        run: npm ci

      - name: Run GoReleaser
        if: steps.tagpr.outputs.tag != ''
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
